name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install -c constraints/release.txt -e ".[dev,providers,proxy]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pip_audit
      - run: python -m pytest -q
      - run: python scripts/check_release.py --tag "${{ github.event.release.tag_name }}"
      - run: python scripts/check_namespace_cutover.py
      - run: python scripts/check_docs.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "import openroutiq; print(openroutiq.__version__)"
      - run: openroutiq --help
      - run: openroutiq-benchmark --help
      - run: openroutiq-benchmark init "${{ runner.temp }}/openroutiq-benchmark-example"
      - run: openroutiq-benchmark validate "${{ runner.temp }}/openroutiq-benchmark-example/replay.json"
      - run: openroutiq-benchmark estimate "${{ runner.temp }}/openroutiq-benchmark-example/replay.json"
      - run: openroutiq-benchmark run "${{ runner.temp }}/openroutiq-benchmark-example/replay.json" --confirm-benchmark
      - run: openroutiq init --provider openrouter --catalog "${{ runner.temp }}/openroutiq-smoke-models.json"
      - run: openroutiq route --catalog "${{ runner.temp }}/openroutiq-smoke-models.json" --strategy balanced "Write a Python function that safely parses JSON."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openroutiq
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
