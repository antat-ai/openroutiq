name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install -c constraints/release.txt -e ".[dev,providers,proxy]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pip_audit
      - run: python -m pytest -q
      - run: python scripts/check_release.py --tag "${{ github.event.release.tag_name }}"
      - run: python scripts/check_namespace_cutover.py
      - run: python scripts/check_docs.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "import openroutiq; print(openroutiq.__version__)"
      - run: openroutiq --help
      - run: openroutiq-benchmark --help
      - run: openroutiq-benchmark init "${{ runner.temp }}/openroutiq-benchmark-example"
      - run: openroutiq-benchmark validate "${{ runner.temp }}/openroutiq-benchmark-example/replay.json"
      - run: openroutiq-benchmark estimate "${{ runner.temp }}/openroutiq-benchmark-example/replay.json"
      - run: openroutiq-benchmark run "${{ runner.temp }}/openroutiq-benchmark-example/replay.json" --confirm-benchmark
      - run: openroutiq init --provider openrouter --catalog "${{ runner.temp }}/openroutiq-smoke-models.json"
      - run: openroutiq route --catalog "${{ runner.temp }}/openroutiq-smoke-models.json" --strategy balanced "Write a Python function that safely parses JSON."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openroutiq
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
