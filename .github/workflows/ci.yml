name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install -c constraints/release.txt -e ".[dev,proxy]"
      - run: python -m pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install -c constraints/release.txt -e ".[dev,providers,proxy]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pip_audit
      - run: python scripts/check_release.py
      - run: python scripts/check_namespace_cutover.py
      - run: python scripts/check_docs.py

  package:
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install -c constraints/release.txt build twine
      - run: python scripts/check_release.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import openroutiq; print(openroutiq.__version__)"
      - run: openroutiq --help
      - run: openroutiq-benchmark --help
      - run: openroutiq-benchmark init "${{ runner.temp }}/openroutiq-benchmark-example"
      - run: openroutiq-benchmark validate "${{ runner.temp }}/openroutiq-benchmark-example/replay.json"
      - run: openroutiq-benchmark estimate "${{ runner.temp }}/openroutiq-benchmark-example/replay.json"
      - run: openroutiq-benchmark run "${{ runner.temp }}/openroutiq-benchmark-example/replay.json" --confirm-benchmark
      - run: openroutiq init --provider openrouter --catalog "${{ runner.temp }}/openroutiq-smoke-models.json"
      - run: openroutiq route --catalog "${{ runner.temp }}/openroutiq-smoke-models.json" --strategy balanced "Write a Python function that safely parses JSON."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
